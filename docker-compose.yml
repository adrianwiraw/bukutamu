services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5173:5173" # Buka Port untuk Vite
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules # Isolasi folder node_modules agar tidak bentrok dengan Windows
    environment:
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@arpusjateng.go.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-secret123}
      ADMIN_GROUP_NAME: ${ADMIN_GROUP_NAME:-Super Admin}
      ADMIN_GROUP_AKSES_PENUH: ${ADMIN_GROUP_AKSES_PENUH:-1}
    depends_on:
      - db
    working_dir: /var/www/html
    # Menggunakan tanda '|' agar perintah panjang ini rapi, mudah dibaca, dan aman dari eror spasi
    command: |
      sh -c "npm install && \
      (npm run dev -- --host &) && \
      if [ -z \"\$(grep APP_KEY .env | cut -d= -f2)\" ]; then php artisan key:generate --no-interaction; fi && \
      php artisan config:clear && \
      php artisan serve --host=0.0.0.0 --port=8000 --no-reload"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: buku_tamu
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - "./database/bukutamu (1).sql:/docker-entrypoint-initdb.d/01-bukutamu.sql:ro"

volumes:
  db_data: