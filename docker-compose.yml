services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-secret123}
      ADMIN_GROUP_NAME: ${ADMIN_GROUP_NAME:-Super Admin}
      ADMIN_GROUP_AKSES_PENUH: ${ADMIN_GROUP_AKSES_PENUH:-1}
    depends_on:
      - db
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: buku_tamu
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
